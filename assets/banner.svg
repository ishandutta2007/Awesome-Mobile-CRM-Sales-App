<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #cbd5e1;
    }

    /* Ambient Dynamic Pulsing Orbs */
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.6; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-35px, 20px) scale(1.1); opacity: 0.55; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
    }

    /* Background Dynamic Floating Metrics */
    @keyframes cardFloat1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes cardFloat2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .orb-1 { animation: floatOrb1 9s ease-in-out infinite; transform-origin: 900px 100px; }
    .orb-2 { animation: floatOrb2 11s ease-in-out infinite; transform-origin: 150px 280px; }
    .card-1 { animation: cardFloat1 6s ease-in-out infinite; }
    .card-2 { animation: cardFloat2 7s ease-in-out infinite; }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashMove 2.5s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND LAYER (Ambient Pulsing Glows) -->
  <g>
    <circle class="orb-1" cx="950" cy="120" r="160" fill="url(#glowGrad)" filter="url(#blurFilter)" />
    <circle class="orb-2" cx="180" cy="260" r="180" fill="url(#glowGrad)" filter="url(#blurFilter)" />
    <ellipse cx="600" cy="40" rx="300" ry="80" fill="#38bdf8" opacity="0.08" filter="url(#blurFilter)" />
  </g>

  <!-- DYNAMIC VISUAL ACCENTS (Side Floating Graphic Cards - positioned safely away from foreground text) -->
  <g class="card-1" opacity="0.75" filter="url(#badgeShadow)">
    <rect x="960" y="55" width="190" height="70" rx="12" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <circle cx="985" cy="80" r="10" fill="#10b981" opacity="0.2" />
    <circle cx="985" cy="80" r="4" fill="#10b981" />
    <text x="1005" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Pipeline Synced</text>
    <text x="1005" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Offline-First Engine</text>
    <line x1="975" y1="112" x2="1135" y2="112" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" class="flow-line" />
  </g>

  <g class="card-2" opacity="0.75" filter="url(#badgeShadow)">
    <rect x="940" y="160" width="210" height="90" rx="12" fill="#0f172a" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2" />
    <text x="960" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#818cf8">FIELD SALES VELOCITY</text>
    <text x="960" y="218" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">+42.8%</text>
    <text x="1035" y="217" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#10b981">↑ Mobile Closes</text>
    <line x1="960" y1="233" x2="1130" y2="233" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="965" cy="233" r="3" fill="#38bdf8" />
    <circle cx="1025" cy="227" r="3" fill="#818cf8" />
    <circle cx="1085" cy="221" r="3" fill="#c084fc" />
    <circle cx="1130" cy="215" r="3" fill="#10b981" />
  </g>

  <!-- FOREGROUND LAYER (Guaranteed clear & unobstructed) -->
  <g transform="translate(60, 48)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="248" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="20" class="tag-text">MOBILE CRM &amp; FIELD SALES</text>

    <!-- Main Title & Decorative Accent -->
    <text x="0" y="78" class="title-text">Awesome Mobile CRM</text>
    <text x="0" y="124" class="title-text" fill="url(#accentGrad)">&amp; Sales App Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="162" class="subtitle-text">Curated guide to enterprise native mobile CRMs, offline-first field sales apps,</text>
    <text x="0" y="188" class="subtitle-text">and self-hosted relationship management platforms with open APIs.</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="168" height="30" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="14" y="19" class="chip-text">📱 iOS &amp; Android Native</text>

      <rect x="180" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="194" y="19" class="chip-text">⚡ Offline Sync Engines</text>

      <rect x="357" y="0" width="170" height="30" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="371" y="19" class="chip-text">🔓 Self-Hosted Stacks</text>

      <rect x="539" y="0" width="170" height="30" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="553" y="19" class="chip-text">💼 Pipeline Automation</text>
    </g>
  </g>
</svg>
